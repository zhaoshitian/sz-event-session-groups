  filesystem > nanoagent.plugin.v0001.FilesystemConfig:
    write: [workspace]

tools > dict[contract.Tool, nanoagent.plugin.v0001.ToolConfig]:
  group_sessions:
    description: "Partition an unordered multi-user event stream into deterministic inactivity-gap sessions."
tasks > dict[contract.Task, nanoagent.plugin.v0001.TaskConfig]:
  group-sessions:
    description: "Partition an unordered multi-user event stream into deterministic inactivity-gap sessions."
    runner: tool
    tools: [group_sessions]
    reference: null
    instructions: "Within each user, order events by (minute,event_id). Adjacent events join when their gap <= gap; a larger gap splits. Session end is the last event time. Sort sessions by user then start. total counts sessions. Save canonical JSON with records and total at destination and return the same rows and total with its path."
